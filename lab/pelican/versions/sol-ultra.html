<script>
(() => {
const scene = document.getElementById('pelican-scene');
const toggle = document.getElementById('play-toggle');
const icon = document.getElementById('play-icon');
const state = document.getElementById('motion-state');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let playing = !reduced.matches, speed = 1, clock = 0, previous = 0;
scene.pauseAnimations();
scene.setCurrentTime(0);
const mobile = matchMedia('(max-width:620px)');
function fit() { scene.setAttribute('viewBox', mobile.matches ? '215 38 620 555' : '0 0 1000 620'); }
fit(); mobile.addEventListener('change', fit);
function updateButton() {
  toggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
  toggle.setAttribute('aria-pressed', String(!playing));
  icon.setAttribute('d', playing ? 'M5 4h3v12H5zm7 0h3v12h-3z' : 'M6 3l11 7-11 7z');
  document.body.classList.toggle('paused', !playing);
  state.textContent = playing ? 'ON THE MOVE' : 'TAKE A BREATHER';
}
toggle.addEventListener('click', () => { playing = !playing; previous = 0; updateButton(); });
document.querySelectorAll('[data-speed]').forEach(button => button.addEventListener('click', () => {
  speed = Number(button.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
}));
reduced.addEventListener('change', event => { playing = !event.matches; previous = 0; updateButton(); });
document.addEventListener('visibilitychange', () => { previous = 0; });
function frame(now) {
  if (playing && !document.hidden && previous) { clock += (now - previous) / 1000 * speed; scene.setCurrentTime(clock); }
  previous = now;
  requestAnimationFrame(frame);
}
updateButton(); requestAnimationFrame(frame);
})();
</script>
