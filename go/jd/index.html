<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>正在打开京东...</title>
  <style>
    :root {
      --bg: #f8f8f8;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --subtext: #888888;
      --red: #e1251b;
      --red-hover: #c8160d;
      --border: #eeeeee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card-bg: #1e1e1e;
        --text: #f0f0f0;
        --subtext: #aaaaaa;
        --red: #e1251b;
        --red-hover: #f03a31;
        --border: #2a2a2a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .icon {
      width: 60px;
      height: 60px;
      background: var(--red);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      margin-bottom: 20px;
    }
    h2 { font-size: 19px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; color: var(--subtext); margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--red);
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-primary:active { background: var(--red-hover); transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      color: var(--subtext);
      font-size: 14px;
      font-weight: normal;
      padding: 10px;
    }
    .btn-secondary:hover { text-decoration: underline; color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🐶</div>
    <h2 id="title">前往京东查看商品</h2>
    <p id="desc">轻点下方按钮唤起京东 App 或在浏览器查看</p>
    
    <a id="appBtn" class="btn btn-primary" href="#">👉 打开京东 App</a>
    <a id="webBtn" class="btn btn-secondary" href="#" target="_blank">在浏览器查看网页版</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const skuId = params.get('sku') || params.get('id');

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const appBtn = document.getElementById('appBtn');
      const webBtn = document.getElementById('webBtn');

      if (!skuId) {
        titleEl.textContent = '缺少商品 SKU ID';
        descEl.textContent = '链接中未包含有效的 sku 或 id 参数，无法完成跳转。';
        appBtn.style.display = 'none';
        webBtn.style.display = 'none';
        return;
      }

      const paramsJson = JSON.stringify({
        category: "jump",
        des: "productDetail",
        skuId: String(skuId),
        sourceType: "item",
        sourceValue: "warp-direct"
      });
      // 京东最新的通用 scheme 统一为 openapp.jdmobile://
      const schemeUrl = 'openapp.jdmobile://virtual?params=' + encodeURIComponent(paramsJson);
      const webUrl = 'https://item.jd.com/' + encodeURIComponent(skuId) + '.html';

      appBtn.href = schemeUrl;
      webBtn.href = webUrl;

      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      if (!isMobile) {
        // 电脑端直接自动进网页版
        titleEl.textContent = '正在前往京东网页版...';
        setTimeout(() => {
          window.location.href = webUrl;
        }, 300);
      } else {
        // 移动端绑定用户手势点击，彻底杜绝 Safari "网址无效" 弹窗
        appBtn.addEventListener('click', function(e) {
          // 尝试唤起
          setTimeout(() => {
            if (!document.hidden) {
              // 若未安装或未唤起，平滑降级跳网页版
              window.location.href = webUrl;
            }
          }, 1800);
        });
      }
    })();
  </script>
</body>
</html>
