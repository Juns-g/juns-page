<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>正在打开拼多多...</title>
  <style>
    :root {
      --bg: #f8f8f8;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --subtext: #888888;
      --red: #e02e24;
      --red-hover: #c42219;
      --border: #eeeeee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card-bg: #1e1e1e;
        --text: #f0f0f0;
        --subtext: #aaaaaa;
        --red: #e02e24;
        --red-hover: #f13c32;
        --border: #2a2a2a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .icon {
      width: 60px;
      height: 60px;
      background: var(--red);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    h2 { font-size: 19px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; color: var(--subtext); margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--red);
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-primary:active { background: var(--red-hover); transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      color: var(--subtext);
      font-size: 14px;
      font-weight: normal;
      padding: 10px;
    }
    .btn-secondary:hover { text-decoration: underline; color: var(--text); }
  </style>
  <script src="/go/qrcode.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="icon">拼</div>
    <h2 id="title">正在跳转拼多多...</h2>
    <p id="desc">系统即将自动唤起拼多多 App 查看商品</p>
    
    <div id="qrcode" style="display:none; margin: 0 auto 20px; padding: 12px; background: #ffffff; border-radius: 14px; width: fit-content; box-shadow: 0 4px 16px rgba(0,0,0,0.08);"></div>

    <a id="appBtn" class="btn btn-primary" href="#">👉 点此打开拼多多 App</a>
    <a id="webBtn" class="btn btn-secondary" href="#" target="_blank">在浏览器查看网页版</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const goodsId = params.get('id') || params.get('goods_id');

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const appBtn = document.getElementById('appBtn');
      const webBtn = document.getElementById('webBtn');

      if (!goodsId) {
        titleEl.textContent = '缺少商品 ID';
        descEl.textContent = '链接中未包含有效的 id 或 goods_id 参数，无法完成跳转。';
        appBtn.style.display = 'none';
        webBtn.style.display = 'none';
        return;
      }

      const schemeUrl = 'pinduoduo://com.xunmeng.pinduoduo/goods_detail.html?goods_id=' + encodeURIComponent(goodsId);
      const webUrl = 'https://mobile.yangkeduo.com/goods.html?goods_id=' + encodeURIComponent(goodsId);

      appBtn.href = schemeUrl;
      webBtn.href = webUrl;

      const isIPad = (navigator.userAgent.includes('Macintosh') && navigator.maxTouchPoints > 1) 
                  || /iPad/i.test(navigator.userAgent);
      const isMobile = isIPad || /iPhone|iPod|Android/i.test(navigator.userAgent);

      if (isMobile) {
        setTimeout(() => {
          window.location.href = schemeUrl;
        }, 50);

        setTimeout(() => {
          if (!document.hidden) {
            titleEl.textContent = '未自动打开？';
            descEl.textContent = '请点击下方红色按钮手动唤起 App，或选择在网页查看。';
          }
        }, 1500);
      } else {
        // PC 电脑端：安静停留在当前页，展示扫码二维码，由用户决定是否进入网页版
        titleEl.textContent = '拼多多商品详情';
        descEl.textContent = '请使用拼多多 App 扫码查看，或点击下方按钮进入商品页。';
        appBtn.style.display = 'none';
        webBtn.className = 'btn btn-primary';
        webBtn.textContent = '在浏览器打开商品页 ↗';
        if (window.QRCode) {
          const qrContainer = document.getElementById('qrcode');
          if (qrContainer) {
            qrContainer.style.display = 'block';
            new QRCode(qrContainer, {
              text: webUrl,
              width: 150,
              height: 150,
              colorDark: "#1a1a1a",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M
            });
          }
        }
      }
    })();
  </script>
</body>
</html>
