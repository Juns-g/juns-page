<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>正在打开酷安...</title>
  <style>
    :root {
      --bg: #f8f8f8;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --subtext: #888888;
      --green: #11b066;
      --green-hover: #0ea05c;
      --border: #eeeeee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --card-bg: #1e1e1e;
        --text: #f0f0f0;
        --subtext: #aaaaaa;
        --green: #11b066;
        --green-hover: #16c674;
        --border: #2a2a2a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .icon {
      width: 60px;
      height: 60px;
      background: var(--green);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      margin-bottom: 20px;
    }
    h2 { font-size: 19px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; color: var(--subtext); margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: var(--green);
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-primary:active { background: var(--green-hover); transform: scale(0.98); }
    .btn-secondary {
      background: transparent;
      color: var(--subtext);
      font-size: 14px;
      font-weight: normal;
      padding: 10px;
    }
    .btn-secondary:hover { text-decoration: underline; color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌿</div>
    <h2 id="title">前往酷安查看动态</h2>
    <p id="desc">轻点下方按钮唤起酷安 App 或在浏览器查看</p>
    
    <a id="appBtn" class="btn btn-primary" href="#">👉 打开酷安 App</a>
    <a id="webBtn" class="btn btn-secondary" href="#" target="_blank">在浏览器查看网页版</a>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const feedId = params.get('id');

      const titleEl = document.getElementById('title');
      const descEl = document.getElementById('desc');
      const appBtn = document.getElementById('appBtn');
      const webBtn = document.getElementById('webBtn');

      if (!feedId) {
        titleEl.textContent = '缺少动态 ID';
        descEl.textContent = '链接中未包含有效的 id 参数，无法完成跳转。';
        appBtn.style.display = 'none';
        webBtn.style.display = 'none';
        return;
      }

      const isAndroid = /Android/i.test(navigator.userAgent);
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // 酷安 Android 规则带完整 host，iOS 则通过标准 scheme 或 universal link
      const targetScheme = isAndroid 
        ? 'coolmarket://www.coolapk.com/feed/' + encodeURIComponent(feedId)
        : 'coolmarket://feed/' + encodeURIComponent(feedId);
      const webUrl = 'https://www.coolapk.com/feed/' + encodeURIComponent(feedId);

      appBtn.href = targetScheme;
      webBtn.href = webUrl;

      if (!isMobile) {
        // 电脑端自动跳网页版
        titleEl.textContent = '正在前往酷安网页版...';
        setTimeout(() => {
          window.location.href = webUrl;
        }, 300);
      } else {
        // 移动端通过用户手势唤起，杜绝系统"网址无效"弹窗
        appBtn.addEventListener('click', function(e) {
          setTimeout(() => {
            if (!document.hidden) {
              window.location.href = webUrl;
            }
          }, 1800);
        });
      }
    })();
  </script>
</body>
</html>
