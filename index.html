<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Juns — a small corner of the internet.">
    <title>Juns</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f6f6f3;
        --ink: #171716;
        --muted: #6e6e68;
        --rule: #d9d9d2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #11110f;
          --ink: #f3f2ec;
          --muted: #aaa9a2;
          --rule: #34342f;
        }
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-rounded, "Avenir Next", Avenir, "SF Pro Rounded", system-ui, sans-serif;
      }
      main { width: min(100%, 38rem); }
      .wordmark {
        margin: 0 0 1.25rem;
        font-size: clamp(3rem, 11vw, 5.6rem);
        font-weight: 650;
        letter-spacing: -0.075em;
        line-height: 0.9;
      }
      .line {
        width: 2.75rem;
        border: 0;
        border-top: 1px solid var(--rule);
        margin: 0 0 1.25rem;
      }
      p {
        max-width: 27rem;
        margin: 0;
        font-size: clamp(1rem, 2.4vw, 1.2rem);
        line-height: 1.55;
      }
      .entries { display: grid; justify-items: start; gap: 0.7rem; margin-top: 0.9rem; }
      .lab {
        display: inline-block;
        color: var(--ink);
        text-decoration: none;
        font-size: clamp(1rem, 2.4vw, 1.2rem);
        line-height: 1.55;
      }
      .lab strong {
        font-weight: 650;
        text-decoration: underline;
        text-decoration-color: var(--muted);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
        transition: text-decoration-color 160ms ease;
      }
      .lab-arrow { display: inline-block; color: var(--muted); transition: transform 160ms ease; }
      .lab:focus-visible strong { text-decoration-color: currentColor; }
      @media (hover: hover) and (pointer: fine) {
        .lab:hover strong { text-decoration-color: currentColor; }
        .lab:hover .lab-arrow { transform: translateX(3px); }
      }
      .lab:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
      .lab-meta {
        display: block;
        margin-top: 0.1rem;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.78rem;
        letter-spacing: 0.02em;
      }
      .lab-meta[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .lab strong, .lab-arrow { transition: none; }
        .lab:hover .lab-arrow { transform: none; }
      }
      .domain {
        display: block;
        margin-top: 2.5rem;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
        letter-spacing: 0.035em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="wordmark">Juns</h1>
      <hr class="line">
      <p>A small corner of the internet.</p>
      <div class="entries">
        <a class="lab" href="/lab/">
          <span class="lab-text">Things I've made with AI <span class="lab-arrow" aria-hidden="true">→</span> <strong>Lab</strong></span>
          <span class="lab-meta" hidden></span>
        </a>
        <a class="lab" href="https://photos.juns.page">
          <span class="lab-text">Photos I've taken <span class="lab-arrow" aria-hidden="true">→</span> <strong>Photos</strong></span>
        </a>
      </div>
      <span class="domain">juns.page</span>
    </main>
    <script>
      fetch('/lab/items.json')
        .then((response) => (response.ok ? response.json() : Promise.reject()))
        .then((data) => {
          const meta = document.querySelector('.lab-meta');
          meta.textContent = `${data.items.length} items · updated ${data.updated}`;
          meta.hidden = false;
        })
        .catch(() => {});
    </script>
  </body>
</html>
